<app-tabs [options]="tabs" [value]="form.selectedTab()" (valueChange)="form.setTab($event)" />

<app-field label="Ilość" icon="lucideEdit" inputId="value">
  <app-form-input
    [value]="form.value()"
    (valueChange)="form.setValue($event)"
    (increment)="form.increment()"
    (decrement)="form.decrement()"
  />
  <app-select
    [options]="options"
    [value]="form.selectedType()"
    (valueChange)="form.setType($event)"
  />
</app-field>

<app-panel>
  <app-info-row
    icon="lucideTrendingUpDown"
    label="Kurs NGP Coin"
    unit="USD"
    [value]="form.marketPrice()"
  />

  <app-stat-grid [tokens]="form.tokens()" [usd]="form.usd()" />
</app-panel>

<button appButton icon="lucideCircleDollarSign" [disabled]="form.disabled()" (click)="form.order()">
  {{ form.submitLabel() }}
</button>
