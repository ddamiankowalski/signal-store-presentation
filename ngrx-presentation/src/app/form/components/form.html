<section class="w-140">
  <div role="tablist" class="flex gap-2 bg-surface-container rounded-xl">
    @let tab = form.selectedTab();

    <button
      (click)="onTab('LONG')"
      role="tab"
      class="focus-visible:outline-4 focus-visible:outline-primary/50 w-full flex-1 cursor-pointer font-semibold text-lg transition-colors py-2 rounded-lg"
      [ngClass]="{
        'text-on-primary bg-primary hover:bg-primary-hover active:bg-primary-active':
          tab === 'LONG',
        'text-on-surface-variant': tab !== 'LONG',
      }"
    >
      Kup / Long
    </button>
    <button
      (click)="onTab('SHORT')"
      role="tab"
      class="focus-visible:outline-4 focus-visible:outline-primary/50 w-full flex-1 cursor-pointer font-semibold text-lg transition-colors py-2 rounded-lg"
      [ngClass]="{
        'text-on-primary bg-primary hover:bg-primary-hover active:bg-primary-active':
          tab === 'SHORT',
        'text-on-surface-variant': tab !== 'SHORT',
      }"
    >
      Sprzedaj / Short
    </button>
  </div>

  <button
    class="focus-visible:outline-4 focus-visible:outline-primary/50 w-full font-semibold text-lg cursor-pointer bg-primary hover:bg-primary-hover active:bg-primary-active transition-colors px-16 py-4 text-on-primary rounded-xl"
  >
    Złóż zlecenie kupna
  </button>
</section>
